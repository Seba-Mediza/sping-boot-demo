spring.application.name=calculadora

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# MySQL (ver docker-compose.yml para levantar una instancia local con estas mismas credenciales)
spring.datasource.url=jdbc:mysql://localhost:3306/calculadora?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=calculadora
spring.datasource.password=calculadora
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# "update": Hibernate crea las tablas que falten al levantar el proyecto y no borra datos existentes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
